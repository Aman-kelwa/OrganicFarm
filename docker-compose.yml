services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: organicfarm-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
    container_name: organicfarm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
